<!DOCTYPE html>
<html>

<head>

    <title>Promo Video</title>

    <script>

        function videoReady() {

            document.getElementById("message").innerHTML =
            "Video ready to play";

        }

        window.onbeforeunload = function() {

            return "You have not completed the form";

        }

    </script>

</head>

<body>

    <h2>Community Event Promo</h2>

    <video width="500"
           controls
           oncanplay="videoReady()">

        <source src="promo.mp4"
                type="video/mp4">

    </video>

    <p id="message"></p>

</body>
</html>
