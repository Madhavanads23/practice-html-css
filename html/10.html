<!DOCTYPE html>
<html>

<head>

    <title>Debug Example</title>

    <script>

        let value = 10;

        console.log("Value is:", value);

        function calculate() {

            let result = value * 2;

            console.log("Result:", result);

            alert("Result = " + result);

        }

    </script>

</head>

<body>

    <h1>Debugging Example</h1>

    <button onclick="calculate()">
        Click Me
    </button>

</body>
</html>
