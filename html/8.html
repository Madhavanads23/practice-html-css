<!DOCTYPE html>
<html>

<head>

    <title>Local Storage Example</title>

    <script>

        function savePreference() {

            let eventType =
            document.getElementById("eventType").value;

            localStorage.setItem(
                "preferredEvent",
                eventType
            );
        }

        function loadPreference() {

            let savedEvent =
            localStorage.getItem("preferredEvent");

            if(savedEvent) {

                document.getElementById("eventType").value =
                savedEvent;

            }
        }

        function clearPreferences() {

            localStorage.clear();
            sessionStorage.clear();

            alert("Preferences Cleared");

        }

    </script>

</head>

<body onload="loadPreference()">

    <h2>Select Preferred Event</h2>

    <select id="eventType"
            onchange="savePreference()">

        <option>Music Fest</option>
        <option>Sports Day</option>
        <option>Food Carnival</option>

    </select>

    <br><br>

    <button onclick="clearPreferences()">
        Clear Preferences
    </button>

</body>
</html>
