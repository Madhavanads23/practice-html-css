<!DOCTYPE html>
<html>

<head>

    <title>Image Gallery</title>

    <style>

        .galleryImage {
            width: 200px;
            height: 150px;
            border: 3px solid black;
            padding: 5px;
        }

        table {
            margin: auto;
        }

        caption {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 10px;
        }

    </style>

</head>

<body>

    <table border="1">

        <caption>Community Event Gallery</caption>

        <tr>

            <td>
                <img src="music.jpg"
                     alt="Music Event"
                     title="Music Event"
                     class="galleryImage">
                <p>Music Fest</p>
            </td>

            <td>
                <img src="food.jpg"
                     alt="Food Festival"
                     title="Food Festival"
                     class="galleryImage">
                <p>Food Carnival</p>
            </td>

            <td>
                <img src="sports.jpg"
                     alt="Sports Event"
                     title="Sports Event"
                     class="galleryImage">
                <p>Sports Day</p>
            </td>

        </tr>

        <tr>

            <td>
                <img src="dance.jpg"
                     alt="Dance Event"
                     title="Dance Event"
                     class="galleryImage">
                <p>Dance Program</p>
            </td>

            <td>
                <img src="art.jpg"
                     alt="Art Show"
                     title="Art Show"
                     class="galleryImage">
                <p>Art Exhibition</p>
            </td>

            <td>
                <img src="book.jpg"
                     alt="Book Fair"
                     title="Book Fair"
                     class="galleryImage">
                <p>Book Fair</p>
            </td>

        </tr>

    </table>

</body>
</html>
